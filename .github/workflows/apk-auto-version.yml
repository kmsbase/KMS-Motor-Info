name: KMS APK Auto Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versi APK, contoh 27.4 atau 27.4.1"
        required: true
        type: string
      release_id:
        description: "ID GitHub staging release"
        required: true
        type: string
      asset_name:
        description: "Nama file APK staging"
        required: true
        type: string

permissions:
  contents: write

jobs:
  process-apk:
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ inputs.version }}
      RELEASE_ID: ${{ inputs.release_id }}
      ASSET_NAME: ${{ inputs.asset_name }}

    steps:
      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Format versi tidak valid: $VERSION"
            exit 1
          fi

      - name: Calculate versionCode
        shell: bash
        run: |
          set -euo pipefail
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH="${PATCH:-0}"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          if (( VERSION_CODE <= 0 )); then
            echo "versionCode tidak valid."
            exit 1
          fi
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Version Name : $VERSION"
          echo "Version Code : $VERSION_CODE"

      - name: Prepare Android tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget unzip jq
          wget -q \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar \
            -O apktool.jar

          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)

          test -n "$AAPT"
          test -n "$APKSIGNER"
          test -n "$ZIPALIGN"

          echo "AAPT=$AAPT" >> "$GITHUB_ENV"
          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"
          echo "ZIPALIGN=$ZIPALIGN" >> "$GITHUB_ENV"

      - name: Get staging APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          RELEASE_JSON=$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "$API/releases/$RELEASE_ID"
          )

          echo "$RELEASE_JSON" > staging-release.json

          ASSET_ID=$(
            echo "$RELEASE_JSON" |
            jq -r --arg NAME "$ASSET_NAME" \
              '.assets[] | select(.name == $NAME) | .id' |
            head -n 1
          )

          if [[ -z "$ASSET_ID" || "$ASSET_ID" == "null" ]]; then
            echo "Asset staging tidak ditemukan: $ASSET_NAME"
            exit 1
          fi

          echo "ASSET_ID=$ASSET_ID" >> "$GITHUB_ENV"

          curl -fL \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "$API/releases/assets/$ASSET_ID" \
            -o input.apk

          ls -lh input.apk

      - name: Inspect original APK
        shell: bash
        run: |
          set -euo pipefail
          "$AAPT" dump badging input.apk | grep "^package:"

          PACKAGE_LINE=$("$AAPT" dump badging input.apk | grep "^package:" | head -n 1)

          if [[ "$PACKAGE_LINE" != *"name='id.kms.motorinfo'"* ]]; then
            echo "Package ID bukan id.kms.motorinfo"
            exit 1
          fi

      - name: Restore signing keystore
        shell: bash
        env:
          KMS_KEYSTORE_B64: ${{ secrets.KMS_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KMS_KEYSTORE_B64"
          printf '%s' "$KMS_KEYSTORE_B64" | base64 --decode > kms.keystore
          chmod 600 kms.keystore

      - name: Decode APK
        shell: bash
        run: |
          set -euo pipefail
          java -jar apktool.jar d -s -f input.apk -o decoded

      - name: Update Android version
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import xml.etree.ElementTree as ET

          path = "decoded/AndroidManifest.xml"
          ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", ns)

          version = os.environ["VERSION"]
          version_code = os.environ["VERSION_CODE"]

          tree = ET.parse(path)
          root = tree.getroot()
          root.set(f"{{{ns}}}versionName", version)
          root.set(f"{{{ns}}}versionCode", version_code)
          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY

      - name: Rebuild APK
        shell: bash
        run: |
          set -euo pipefail
          java -jar apktool.jar b decoded -o rebuilt.apk
          ls -lh rebuilt.apk

      - name: Verify rebuilt package and version
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_LINE=$("$AAPT" dump badging rebuilt.apk | grep "^package:" | head -n 1)
          echo "$PACKAGE_LINE"

          [[ "$PACKAGE_LINE" == *"name='id.kms.motorinfo'"* ]]
          [[ "$PACKAGE_LINE" == *"versionName='${VERSION}'"* ]]
          [[ "$PACKAGE_LINE" == *"versionCode='${VERSION_CODE}'"* ]]

      - name: Zipalign APK
        shell: bash
        run: |
          set -euo pipefail
          "$ZIPALIGN" -f -p 4 rebuilt.apk aligned.apk
          "$ZIPALIGN" -c -v 4 aligned.apk

      - name: Sign APK with KMS signing key
        shell: bash
        env:
          KMS_KEYSTORE_PASSWORD: ${{ secrets.KMS_KEYSTORE_PASSWORD }}
          KMS_KEY_ALIAS: ${{ secrets.KMS_KEY_ALIAS }}
          KMS_KEY_PASSWORD: ${{ secrets.KMS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          "$APKSIGNER" sign \
            --ks kms.keystore \
            --ks-pass "pass:$KMS_KEYSTORE_PASSWORD" \
            --ks-key-alias "$KMS_KEY_ALIAS" \
            --key-pass "pass:$KMS_KEY_PASSWORD" \
            --out final.apk \
            aligned.apk

      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail
          "$APKSIGNER" verify --verbose --print-certs final.apk

          PACKAGE_LINE=$("$AAPT" dump badging final.apk | grep "^package:" | head -n 1)
          echo "$PACKAGE_LINE"

          [[ "$PACKAGE_LINE" == *"name='id.kms.motorinfo'"* ]]
          [[ "$PACKAGE_LINE" == *"versionName='${VERSION}'"* ]]
          [[ "$PACKAGE_LINE" == *"versionCode='${VERSION_CODE}'"* ]]

      - name: Prepare final asset
        shell: bash
        run: |
          set -euo pipefail
          FINAL_NAME="kms_motor_info.apk"
          mv final.apk "$FINAL_NAME"
          echo "FINAL_NAME=$FINAL_NAME" >> "$GITHUB_ENV"
          ls -lh "$FINAL_NAME"

      - name: Replace staging asset with final APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          # Delete the staging asset first. GitHub rejects duplicate filenames
          # within the same release.
          curl -fsSL \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "$API/releases/assets/$ASSET_ID"

          RELEASE_JSON=$(cat staging-release.json)
          UPLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '.upload_url' | sed 's/{?name,label}$//')

          curl -fL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -H "Content-Type: application/vnd.android.package-archive" \
            "${UPLOAD_URL}?name=${FINAL_NAME}" \
            --data-binary "@${FINAL_NAME}"

      - name: Promote staging release to final release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          TAG="v${VERSION}"

          curl -fsSL \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "$API/releases/$RELEASE_ID" \
            -d "$(jq -n \
              --arg tag "$TAG" \
              --arg name "KMS Motor Info $VERSION" \
              --arg body "KMS Motor Info APK $VERSION" \
              '{
                tag_name: $tag,
                name: $name,
                body: $body,
                draft: false,
                prerelease: false,
                make_latest: true
              }'
            )"

          echo "Release $RELEASE_ID dipromosikan menjadi v$VERSION."

      - name: Success
        shell: bash
        run: |
          echo "=========================================="
          echo "KMS MOTOR INFO AUTO VERSION BERHASIL"
          echo "=========================================="
          echo "Version      : $VERSION"
          echo "Version Code : $VERSION_CODE"
          echo "APK          : $FINAL_NAME"
          echo "Release ID   : $RELEASE_ID"
          echo "=========================================="
